
name: FRIDAY Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract FRIDAY source
        run: |
          unzip -q FRIDAY_FINAL_FULL_DEVELOPMENT_EDITION.zip -d friday-source

      - name: Build APK
        run: |
          cd friday-source/FRIDAY_FINAL_FULL_DEVELOPMENT_EDITION
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-debug-APK
          path: friday-source/FRIDAY_FINAL_FULL_DEVELOPMENT_EDITION/app/build/outputs/apk/debug/app-debug.apk
          
